<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letter Link Solver</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:18px;background:#111;color:#fff}button{font-size:18px;padding:12px 16px;margin:6px 4px;border:0;border-radius:10px}#video{width:100%;max-height:55vh;background:#222;border-radius:14px;object-fit:cover}#status{padding:10px 0;color:#bbb}.ok{color:#7ee787}.bad{color:#ff7b72}</style></head><body><h1>🔗 Letter Link Solver</h1><p id="status">Tap Start Camera. If prompted, choose Allow.</p><video id="video" autoplay playsinline muted></video><br><button id="start">📷 Start Camera</button><button id="stop">⏹ Stop</button><script>const video=document.getElementById('video'),status=document.getElementById('status');function msg(t,c=''){status.textContent=t;status.className=c}document.getElementById('start').onclick=async()=>{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('Camera access is unavailable in this file preview. It must be opened from a normal HTTPS web address.','bad');return}try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=s;await video.play();msg('Camera is on. Point it at the letter board.','ok')}catch(e){msg('Camera permission was blocked. On iPhone, allow camera access for the browser and reload.','bad');console.error(e)}};document.getElementById('stop').onclick=()=>{if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null;msg('Camera stopped.')};</script></body></html>
